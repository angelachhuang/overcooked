<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Overcooked - Canvas 2D 極簡烹飪速食店</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #1e293b;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }
        /* 虛擬搖桿底座 */
        .joystick-base {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            position: absolute;
            bottom: 24px;
            left: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .joystick-thumb {
            width: 48px;
            height: 48px;
            background: #f97316;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.5);
            transform: translate(0, 0);
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-white select-none">
    <canvas id="gameCanvas"></canvas>

    <!-- 頂部與底部 HUD 介面 -->
    <div class="ui-layer flex flex-col justify-between p-3 md:p-4">
        <!-- 頂部資訊列：訂單卡片與計時/分數 -->
        <div class="flex flex-col md:flex-row justify-between items-start gap-2.5 w-full">
            <!-- 動態訂單列表 -->
            <div id="orders-container" class="flex flex-wrap gap-2 max-w-xl">
                <!-- 訂單卡片將由 JS 動態生成 -->
            </div>

            <!-- 計時與積分計數器 -->
            <div class="flex items-center gap-3 bg-slate-900/90 backdrop-blur-md px-4 py-2 rounded-2xl border border-slate-700/80 shadow-xl self-end md:self-start">
                <div class="flex items-center gap-1.5">
                    <span class="text-lg">⏱️</span>
                    <span id="timer-text" class="text-xl md:text-2xl font-black tracking-wider text-amber-400">03:00</span>
                </div>
                <div class="h-5 w-[1px] bg-slate-700"></div>
                <div class="flex items-center gap-1.5">
                    <span class="text-lg">🪙</span>
                    <span id="score-text" class="text-xl md:text-2xl font-black tracking-wider text-emerald-400">0</span>
                </div>
            </div>
        </div>

        <!-- 底部提示與行動控制器 -->
        <div class="w-full flex justify-between items-end pb-1">
            <!-- 桌面鍵盤提示 -->
            <div class="hidden md:flex flex-col gap-1 bg-slate-900/85 backdrop-blur-md px-3 py-2 rounded-xl border border-slate-800 text-[11px] text-slate-300">
                <div class="font-bold text-amber-400 mb-0.5">🎮 操作指南 (鍵盤)</div>
                <div><kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 font-mono text-white">WASD</kbd> / 方向鍵：移動</div>
                <div><kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 font-mono text-white">Space</kbd> / <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 font-mono text-white">E</kbd>：拿取 / 放置 / 出餐</div>
                <div><kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 font-mono text-white">F</kbd> 長按：砧板切菜</div>
                <div><kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 font-mono text-white">Q</kbd>：拋擲手中生料</div>
            </div>

            <!-- 行動端虛擬搖桿 -->
            <div id="touch-joystick" class="joystick-base interactive md:hidden">
                <div id="joystick-thumb" class="joystick-thumb"></div>
            </div>

            <!-- 行動端虛擬按鈕 -->
            <div class="flex gap-2 interactive md:hidden pb-1 pr-1">
                <button id="btn-throw" class="w-13 h-13 p-3 rounded-2xl bg-indigo-600/90 active:scale-95 shadow-lg flex flex-col items-center justify-center font-bold text-[11px] border border-indigo-400/50">
                    <span class="text-base leading-none">🚀</span>
                    <span>拋擲</span>
                </button>
                <button id="btn-chop" class="w-13 h-13 p-3 rounded-2xl bg-amber-600/90 active:scale-95 shadow-lg flex flex-col items-center justify-center font-bold text-[11px] border border-amber-400/50">
                    <span class="text-base leading-none">🔪</span>
                    <span>切菜</span>
                </button>
                <button id="btn-interact" class="w-15 h-15 p-3.5 rounded-2xl bg-emerald-600 active:scale-95 shadow-xl flex flex-col items-center justify-center font-black text-xs border-2 border-emerald-300">
                    <span class="text-lg leading-none">✋</span>
                    <span>拿放</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 遊戲結束結算彈窗 -->
    <div id="gameover-modal" class="hidden absolute inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-800 border-2 border-amber-500 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
            <h2 class="text-2xl md:text-3xl font-black text-amber-400 mb-1">打烊結算！</h2>
            <p class="text-slate-400 text-xs mb-3">今日出餐服務時間結束</p>
            
            <div id="star-rating" class="text-4xl my-2 tracking-widest">⭐⭐⭐</div>
            
            <div class="bg-slate-900/90 rounded-2xl p-3 my-4 border border-slate-700 flex justify-around items-center">
                <div>
                    <div class="text-[11px] text-slate-400 font-semibold">最終營業額</div>
                    <div id="final-score" class="text-2xl md:text-3xl font-black text-emerald-400">0</div>
                </div>
                <div class="h-7 w-[1px] bg-slate-700"></div>
                <div>
                    <div class="text-[11px] text-slate-400 font-semibold">完成訂單</div>
                    <div id="final-orders" class="text-2xl md:text-3xl font-black text-amber-300">0</div>
                </div>
            </div>

            <button id="btn-restart" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-950 font-black text-base rounded-2xl shadow-lg transition-transform active:scale-95 cursor-pointer">
                再玩一局 🍳
            </button>
        </div>
    </div>

    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playChop() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.07);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.07);
            }
            playThrow() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(260, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(650, this.ctx.currentTime + 0.14);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.14);
            }
            playSuccess() {
                this.init();
                if (!this.ctx) return;
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.07);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.07);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.07 + 0.22);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + i * 0.07);
                    osc.stop(this.ctx.currentTime + i * 0.07 + 0.22);
                });
            }
            playError() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.setValueAtTime(95, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
            playSizzle() {
                this.init();
                if (!this.ctx) return;
                const bufferSize = this.ctx.sampleRate * 0.04;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
                noise.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }
        }
        const sfx = new SoundFX();

        const ItemType = {
            MEAT: 'MEAT',
            TOMATO: 'TOMATO',
            LETTUCE: 'LETTUCE',
            SALAD: 'SALAD',
            MEAT_SALAD: 'MEAT_SALAD'
        };

        const ItemState = {
            RAW: 'RAW',
            CHOPPED: 'CHOPPED',
            COOKED: 'COOKED',
            BURNED: 'BURNED'
        };

        const RECIPES = [
            { id: 'R_STEAK', name: '香煎牛排', icon: '🥩', type: ItemType.MEAT, state: ItemState.COOKED, score: 60 },
            { id: 'R_SALAD', name: '花園沙拉', icon: '🥗', type: ItemType.SALAD, state: ItemState.CHOPPED, score: 80 },
            { id: 'R_MEAT_SALAD', name: '炙燒牛排沙拉', icon: '🍱', type: ItemType.MEAT_SALAD, state: ItemState.COOKED, score: 110 },
            { id: 'R_TOMATO', name: '切片蕃茄', icon: '🍅', type: ItemType.TOMATO, state: ItemState.CHOPPED, score: 35 }
        ];

        const CounterType = {
            CRATE_MEAT: 'CRATE_MEAT',
            CRATE_TOMATO: 'CRATE_TOMATO',
            CRATE_LETTUCE: 'CRATE_LETTUCE',
            CHOPPING: 'CHOPPING',
            STOVE: 'STOVE',
            DELIVERY: 'DELIVERY',
            TRASH: 'TRASH',
            EMPTY_DESK: 'EMPTY_DESK'
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 補齊瀏覽器 Canvas 缺少 fillRoundRect / strokeRoundRect 的相容函式
        if (!CanvasRenderingContext2D.prototype.fillRoundRect) {
            CanvasRenderingContext2D.prototype.fillRoundRect = function(x, y, w, h, r) {
                if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                this.beginPath();
                if (this.roundRect) {
                    this.roundRect(x, y, w, h, [r.tl || 8]);
                } else {
                    const radius = r.tl || 8;
                    this.moveTo(x + radius, y);
                    this.arcTo(x + w, y, x + w, y + h, radius);
                    this.arcTo(x + w, y + h, x, y + h, radius);
                    this.arcTo(x, y + h, x, y, radius);
                    this.arcTo(x, y, x + w, y, radius);
                    this.closePath();
                }
                this.fill();
            };
        }

        if (!CanvasRenderingContext2D.prototype.strokeRoundRect) {
            CanvasRenderingContext2D.prototype.strokeRoundRect = function(x, y, w, h, r) {
                if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                this.beginPath();
                if (this.roundRect) {
                    this.roundRect(x, y, w, h, [r.tl || 8]);
                } else {
                    const radius = r.tl || 8;
                    this.moveTo(x + radius, y);
                    this.arcTo(x + w, y, x + w, y + h, radius);
                    this.arcTo(x + w, y + h, x, y + h, radius);
                    this.arcTo(x, y + h, x, y, radius);
                    this.arcTo(x, y, x + w, y, radius);
                    this.closePath();
                }
                this.stroke();
            };
        }

        let dpr = window.devicePixelRatio || 1;
        let viewScale = 1;
        let originX = 0;
        let originY = 0;

        let gameTime = 180;
        let score = 0;
        let completedOrders = 0;
        let activeOrders = [];
        let isGameOver = false;

        let particles = [];
        let floatTexts = [];
        let thrownItems = [];

        // 廚師定義
        const player = {
            x: 0,
            y: 30,
            radius: 26,
            speed: 260,
            dirX: 0,
            dirY: 1,
            angle: Math.PI / 2,
            heldItem: null,
            targetCounter: null,
            bounce: 0
        };

        let counters = [];

        function buildKitchenLayout() {
            counters = [];
            const W = 72;
            const H = 72;

            // 後排食材區 (Y = -140) - 開闊好走，食材排在中間
            counters.push({ x: -155, y: -140, w: W, h: H, type: CounterType.EMPTY_DESK, name: '備料檯' });
            counters.push({ x: -75,  y: -140, w: W, h: H, type: CounterType.CRATE_MEAT, name: '生肉箱', icon: '🥩' });
            counters.push({ x: 0,    y: -140, w: W, h: H, type: CounterType.CRATE_TOMATO, name: '蕃茄箱', icon: '🍅' });
            counters.push({ x: 75,   y: -140, w: W, h: H, type: CounterType.CRATE_LETTUCE, name: '生菜箱', icon: '🥬' });
            counters.push({ x: 155,  y: -140, w: W, h: H, type: CounterType.EMPTY_DESK, name: '備料檯' });

            // 左側排 (X = -155) - 備料與切菜
            counters.push({ x: -155, y: -60,  w: W, h: H, type: CounterType.CHOPPING, name: '砧板 1', icon: '🔪' });
            counters.push({ x: -155, y: 15,   w: W, h: H, type: CounterType.CHOPPING, name: '砧板 2', icon: '🔪' });
            counters.push({ x: -155, y: 90,   w: W, h: H, type: CounterType.EMPTY_DESK, name: '備料檯' });

            // 右側排 (X = 155) - 煎烤與垃圾桶 (將垃圾桶移至右下最寬敞處，絕不卡牆)
            counters.push({ x: 155,  y: -60,  w: W, h: H, type: CounterType.STOVE, name: '平底鍋 1', icon: '🍳' });
            counters.push({ x: 155,  y: 15,   w: W, h: H, type: CounterType.STOVE, name: '平底鍋 2', icon: '🍳' });
            counters.push({ x: 155,  y: 90,   w: W, h: H, type: CounterType.TRASH, name: '垃圾桶', icon: '🗑️' });

            // 前排中島出餐口 (Y = 160)
            counters.push({ x: -50,  y: 160,  w: 85, h: H, type: CounterType.DELIVERY, name: '出餐口', icon: '🛎️' });
            counters.push({ x: 50,   y: 160,  w: 85, h: H, type: CounterType.DELIVERY, name: '出餐口', icon: '🛎️' });

            counters.forEach(c => {
                c.item = null;
                c.timer = 0;
                c.chopProgress = 0;
            });
        }

        const keys = {
            up: false, down: false, left: false, right: false,
            interact: false, chop: false
        };

        window.addEventListener('keydown', (e) => {
            sfx.init();
            if (isGameOver) return;
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': keys.up = true; break;
                case 'KeyS': case 'ArrowDown': keys.down = true; break;
                case 'KeyA': case 'ArrowLeft': keys.left = true; break;
                case 'KeyD': case 'ArrowRight': keys.right = true; break;
                case 'Space': case 'KeyE':
                    if (!keys.interact) { handleInteract(); keys.interact = true; }
                    break;
                case 'KeyF': keys.chop = true; break;
                case 'KeyQ': handleThrow(); break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': case 'ArrowUp': keys.up = false; break;
                case 'KeyS': case 'ArrowDown': keys.down = false; break;
                case 'KeyA': case 'ArrowLeft': keys.left = false; break;
                case 'KeyD': case 'ArrowRight': keys.right = false; break;
                case 'Space': case 'KeyE': keys.interact = false; break;
                case 'KeyF': keys.chop = false; break;
            }
        });

        // 行動端虛擬按鈕
        const btnInteract = document.getElementById('btn-interact');
        const btnChop = document.getElementById('btn-chop');
        const btnThrow = document.getElementById('btn-throw');

        btnInteract.addEventListener('touchstart', (e) => { e.preventDefault(); sfx.init(); handleInteract(); });
        btnChop.addEventListener('touchstart', (e) => { e.preventDefault(); sfx.init(); keys.chop = true; });
        btnChop.addEventListener('touchend', (e) => { e.preventDefault(); keys.chop = false; });
        btnThrow.addEventListener('touchstart', (e) => { e.preventDefault(); sfx.init(); handleThrow(); });

        // 行動端虛擬搖桿
        let joystickActive = false;
        let joyVector = { x: 0, y: 0 };
        const joyBase = document.getElementById('touch-joystick');
        const joyThumb = document.getElementById('joystick-thumb');

        joyBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            sfx.init();
            joystickActive = true;
            updateJoystick(e.touches[0]);
        });
        window.addEventListener('touchmove', (e) => {
            if (!joystickActive) return;
            for (let i = 0; i < e.touches.length; i++) {
                const t = e.touches[i];
                const rect = joyBase.getBoundingClientRect();
                if (Math.hypot(t.clientX - (rect.left + rect.width / 2), t.clientY - (rect.top + rect.height / 2)) < 130) {
                    updateJoystick(t);
                    break;
                }
            }
        });
        window.addEventListener('touchend', () => {
            joystickActive = false;
            joyVector = { x: 0, y: 0 };
            joyThumb.style.transform = `translate(0px, 0px)`;
        });

        function updateJoystick(touch) {
            const rect = joyBase.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            const dist = Math.hypot(dx, dy);
            const maxR = 40;
            if (dist > maxR) {
                dx = (dx / dist) * maxR;
                dy = (dy / dist) * maxR;
            }
            joyThumb.style.transform = `translate(${dx}px, ${dy}px)`;
            joyVector = { x: dx / maxR, y: dy / maxR };
        }

        function getTargetCounter() {
            let closest = null;
            let bestScore = -Infinity;

            for (let c of counters) {
                const dx = c.x - player.x;
                const dy = c.y - player.y;
                const dist = Math.hypot(dx, dy);

                // 放寬檢測距離至 120，操作手感更靈敏順暢
                if (dist > 120) continue;

                // 面朝方向點積向量 (判斷是否正對著該工作檯)
                const dot = (dx * player.dirX + dy * player.dirY) / (dist || 1);

                // 即使站在斜前方 (dot > 0.05) 也能被有效選中
                if (dot > 0.05) {
                    const score = dot * 2.5 - (dist / 50);
                    if (score > bestScore) {
                        bestScore = score;
                        closest = c;
                    }
                }
            }
            return closest;
        }

        function handleInteract() {
            if (isGameOver) return;
            const counter = getTargetCounter();
            if (!counter) return;

            // 1. 垃圾桶優先判定：手上有任何物品直接丟棄銷毀
            if (counter.type === CounterType.TRASH) {
                if (player.heldItem) {
                    player.heldItem = null;
                    sfx.playError();
                    addFloatText(counter.x, counter.y - 20, '已丟棄 🗑️', '#ef4444');
                } else if (counter.item) {
                    counter.item = null;
                    counter.timer = 0;
                    sfx.playError();
                    addFloatText(counter.x, counter.y - 20, '已清理 🗑️', '#ef4444');
                }
                return;
            }

            // 2. 食材箱生成
            if (counter.type === CounterType.CRATE_MEAT && !player.heldItem) {
                player.heldItem = { type: ItemType.MEAT, state: ItemState.RAW };
                sfx.playThrow();
                addFloatText(player.x, player.y - 30, '+生肉 🥩', '#f87171');
                return;
            }
            if (counter.type === CounterType.CRATE_TOMATO && !player.heldItem) {
                player.heldItem = { type: ItemType.TOMATO, state: ItemState.RAW };
                sfx.playThrow();
                addFloatText(player.x, player.y - 30, '+蕃茄 🍅', '#f43f5e');
                return;
            }
            if (counter.type === CounterType.CRATE_LETTUCE && !player.heldItem) {
                player.heldItem = { type: ItemType.LETTUCE, state: ItemState.RAW };
                sfx.playThrow();
                addFloatText(player.x, player.y - 30, '+生菜 🥬', '#22c55e');
                return;
            }

            // 3. 出餐口交付
            if (counter.type === CounterType.DELIVERY) {
                if (player.heldItem) submitOrder(player.heldItem);
                return;
            }

            // 4. 工作檯物品拿起 / 放置 / 組合
            if (counter.item && !player.heldItem) {
                player.heldItem = counter.item;
                counter.item = null;
                counter.timer = 0;
                counter.chopProgress = 0;
            } else if (!counter.item && player.heldItem) {
                // 平底鍋限制：只有切碎肉排能下鍋
                if (counter.type === CounterType.STOVE) {
                    if (player.heldItem.type !== ItemType.MEAT || player.heldItem.state !== ItemState.CHOPPED) {
                        addFloatText(counter.x, counter.y - 30, '需切碎肉排!', '#f59e0b');
                        sfx.playError();
                        return;
                    }
                }
                counter.item = player.heldItem;
                player.heldItem = null;
                counter.timer = 0;
                counter.chopProgress = 0;
            } else if (counter.item && player.heldItem) {
                // 菜餚組合（切片蕃茄 + 切碎生菜 => 沙拉；熟牛排 + 切碎生菜 => 牛排沙拉）
                checkDishCombination(counter, player.heldItem);
            }
        }

        function checkDishCombination(counter, incoming) {
            const cur = counter.item;
            // 組合 1：切片蕃茄 + 切碎生菜
            const isTom = (cur.type === ItemType.TOMATO && incoming.type === ItemType.LETTUCE);
            const isLet = (cur.type === ItemType.LETTUCE && incoming.type === ItemType.TOMATO);
            if ((isTom || isLet) && cur.state === ItemState.CHOPPED && incoming.state === ItemState.CHOPPED) {
                counter.item = { type: ItemType.SALAD, state: ItemState.CHOPPED };
                player.heldItem = null;
                sfx.playSuccess();
                addFloatText(counter.x, counter.y - 30, '✨ 花園沙拉完成!', '#10b981');
                spawnConfetti(counter.x, counter.y);
                return;
            }

            // 組合 2：熟牛排 + 切碎生菜
            const hasSteak = (cur.type === ItemType.MEAT && cur.state === ItemState.COOKED && incoming.type === ItemType.LETTUCE && incoming.state === ItemState.CHOPPED);
            const hasGreen = (incoming.type === ItemType.MEAT && incoming.state === ItemState.COOKED && cur.type === ItemType.LETTUCE && cur.state === ItemState.CHOPPED);
            if (hasSteak || hasGreen) {
                counter.item = { type: ItemType.MEAT_SALAD, state: ItemState.COOKED };
                player.heldItem = null;
                sfx.playSuccess();
                addFloatText(counter.x, counter.y - 30, '🍱 炙燒牛排沙拉!', '#f59e0b');
                spawnConfetti(counter.x, counter.y);
                return;
            }
        }

        function handleThrow() {
            if (!player.heldItem) return;
            // 規則：只有生料可以被拋擲！
            if (player.heldItem.state !== ItemState.RAW) {
                addFloatText(player.x, player.y - 35, '熟食/半成品不可丟擲!', '#ef4444');
                return;
            }
            sfx.playThrow();
            const item = player.heldItem;
            player.heldItem = null;

            thrownItems.push({
                item: item,
                x: player.x,
                y: player.y,
                vx: player.dirX * 380,
                vy: player.dirY * 380,
                life: 0.55
            });
        }

        function updateThrownItems(delta) {
            for (let i = thrownItems.length - 1; i >= 0; i--) {
                const t = thrownItems[i];
                t.x += t.vx * delta;
                t.y += t.vy * delta;
                t.life -= delta;

                // 檢測是否飛中空檯面
                for (let c of counters) {
                    if (!c.item && c.type !== CounterType.CRATE_MEAT && c.type !== CounterType.CRATE_TOMATO && c.type !== CounterType.CRATE_LETTUCE) {
                        if (Math.hypot(t.x - c.x, t.y - c.y) < 32) {
                            c.item = t.item;
                            sfx.playSuccess();
                            addFloatText(c.x, c.y - 25, '接住! 🎯');
                            thrownItems.splice(i, 1);
                            break;
                        }
                    }
                }

                if (t.life <= 0) {
                    thrownItems.splice(i, 1);
                }
            }
        }

        function updateCounters(delta) {
            counters.forEach(c => {
                // 1. 砧板切菜
                if (c.type === CounterType.CHOPPING && c.item && c.item.state === ItemState.RAW) {
                    if (keys.chop && player.targetCounter === c) {
                        c.chopProgress += delta * 1.3;
                        sfx.playChop();
                        spawnChopParticles(c.x, c.y);

                        if (c.chopProgress >= 1.0) {
                            c.item.state = ItemState.CHOPPED;
                            c.chopProgress = 0;
                            sfx.playSuccess();
                            addFloatText(c.x, c.y - 30, '切碎完成! 🔪', '#38bdf8');
                        }
                    }
                }

                // 2. 平底鍋煎烤與超時焦黑
                if (c.type === CounterType.STOVE && c.item) {
                    if (c.item.type === ItemType.MEAT && c.item.state === ItemState.CHOPPED) {
                        c.timer += delta;
                        sfx.playSizzle();
                        spawnSizzleSmoke(c.x, c.y, '#f8fafc');

                        if (c.timer >= 4.0) {
                            c.item.state = ItemState.COOKED;
                            c.timer = 0;
                            sfx.playSuccess();
                            addFloatText(c.x, c.y - 30, '煎熟牛排! 🥩', '#10b981');
                        }
                    } else if (c.item.state === ItemState.COOKED) {
                        c.timer += delta;
                        if (c.timer >= 4.5) { // 熟了之後再過 4.5 秒直接焦黑
                            c.item.state = ItemState.BURNED;
                            c.timer = 0;
                            sfx.playError();
                            addFloatText(c.x, c.y - 30, '焦黑報廢! ⚠️', '#ef4444');
                        }
                    } else if (c.item.state === ItemState.BURNED) {
                        spawnSizzleSmoke(c.x, c.y, '#1e293b'); // 焦黑冒黑煙
                    }
                }
            });
        }

        function spawnOrder() {
            if (activeOrders.length >= 4) return;
            const recipe = RECIPES[Math.floor(Math.random() * RECIPES.length)];
            activeOrders.push({
                id: Math.random().toString(36).substring(7),
                recipe: recipe,
                maxDuration: 42,
                timeLeft: 42
            });
            renderOrdersUI();
        }

        function updateOrders(delta) {
            for (let i = activeOrders.length - 1; i >= 0; i--) {
                const o = activeOrders[i];
                o.timeLeft -= delta;
                if (o.timeLeft <= 0) {
                    score = Math.max(0, score - 25);
                    activeOrders.splice(i, 1);
                    sfx.playError();
                    renderOrdersUI();
                    spawnOrder();
                }
            }
        }

        function submitOrder(item) {
            let matched = -1;
            for (let i = 0; i < activeOrders.length; i++) {
                const req = activeOrders[i].recipe;
                if (req.type === item.type && req.state === item.state) {
                    matched = i;
                    break;
                }
            }

            if (matched !== -1) {
                const ord = activeOrders[matched];
                const tip = Math.floor((ord.timeLeft / ord.maxDuration) * 25);
                const gained = ord.recipe.score + tip;
                score += gained;
                completedOrders++;

                addFloatText(player.x, player.y - 35, `+${gained} (含小費+${tip})! 🌟`, '#34d399');
                activeOrders.splice(matched, 1);
                player.heldItem = null;
                sfx.playSuccess();
                renderOrdersUI();
                spawnOrder();
            } else {
                score = Math.max(0, score - 15);
                player.heldItem = null;
                sfx.playError();
                addFloatText(player.x, player.y - 35, '出餐錯誤 -15 ❌', '#f87171');
            }
            document.getElementById('score-text').innerText = score;
        }

        function renderOrdersUI() {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            activeOrders.forEach(o => {
                const pct = Math.max(0, (o.timeLeft / o.maxDuration) * 100);
                const barColor = pct > 45 ? 'bg-emerald-500' : (pct > 20 ? 'bg-amber-500' : 'bg-rose-500');

                const card = document.createElement('div');
                card.className = "bg-slate-900/90 border border-slate-700/90 rounded-xl p-2 shadow-lg flex flex-col w-24 md:w-28 backdrop-blur-sm";
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xl md:text-2xl">${o.recipe.icon}</span>
                        <span class="text-xs font-black text-amber-300">+${o.recipe.score}</span>
                    </div>
                    <div class="text-[10px] md:text-[11px] font-bold truncate mt-0.5 text-slate-200">${o.recipe.name}</div>
                    <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mt-1.5">
                        <div class="${barColor} h-full transition-all duration-200" style="width: ${pct}%"></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addFloatText(x, y, text, color = '#fbbf24') {
            floatTexts.push({ x, y, text, color, alpha: 1.0 });
        }

        function spawnSizzleSmoke(x, y, color) {
            particles.push({
                x: x + (Math.random() - 0.5) * 20,
                y: y + (Math.random() - 0.5) * 15,
                vx: (Math.random() - 0.5) * 15,
                vy: -Math.random() * 28 - 10,
                radius: Math.random() * 4 + 2,
                color: color,
                alpha: 0.7,
                life: 0.6
            });
        }

        function spawnChopParticles(x, y) {
            for (let i = 0; i < 3; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 60,
                    vy: (Math.random() - 0.5) * 60,
                    radius: 3,
                    color: '#f87171',
                    alpha: 1.0,
                    life: 0.35
                });
            }
        }

        function spawnConfetti(x, y) {
            const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899'];
            for (let i = 0; i < 16; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 120,
                    vy: (Math.random() - 0.5) * 120,
                    radius: Math.random() * 3 + 2,
                    color: colors[i % colors.length],
                    alpha: 1.0,
                    life: 0.6
                });
            }
        }

        function updatePlayer(delta) {
            let moveX = 0;
            let moveY = 0;

            if (keys.up) moveY -= 1;
            if (keys.down) moveY += 1;
            if (keys.left) moveX -= 1;
            if (keys.right) moveX += 1;

            if (joystickActive) {
                moveX = joyVector.x;
                moveY = joyVector.y;
            }

            const len = Math.hypot(moveX, moveY);
            if (len > 0.05) {
                const normX = moveX / len;
                const normY = moveY / len;

                player.dirX = normX;
                player.dirY = normY;
                player.angle = Math.atan2(normY, normX);

                const nextX = player.x + normX * player.speed * delta;
                const nextY = player.y + normY * player.speed * delta;

                // 廚房工作區碰撞（內部活動長方形邊界與工作檯碰撞）
                let collide = false;
                for (let c of counters) {
                    if (Math.abs(nextX - c.x) < (c.w / 2 + player.radius - 4) &&
                        Math.abs(nextY - c.y) < (c.h / 2 + player.radius - 4)) {
                        collide = true;
                        break;
                    }
                }

                if (!collide && Math.abs(nextX) < 220 && Math.abs(nextY) < 200) {
                    player.x = nextX;
                    player.y = nextY;
                }

                player.bounce = Math.sin(Date.now() * 0.018) * 3;
            } else {
                player.bounce = 0;
            }

            player.targetCounter = getTargetCounter();
        }

        function drawTileFloor() {
            const tileSize = 44;
            const startX = -320;
            const endX = 320;
            const startY = -300;
            const endY = 300;

            for (let x = startX; x < endX; x += tileSize) {
                for (let y = startY; y < endY; y += tileSize) {
                    const isEven = (Math.floor(x / tileSize) + Math.floor(y / tileSize)) % 2 === 0;
                    ctx.fillStyle = isEven ? '#1e293b' : '#334155';
                    ctx.fillRect(x, y, tileSize, tileSize);
                }
            }

            // 外圍廚房牆壁陰影
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 14;
            ctx.strokeRect(-240, -220, 480, 440);
        }

        function drawCounter(c) {
            ctx.save();
            ctx.translate(c.x, c.y);

            // 邊緣選中光暈 (當玩家面對此工作檯時高亮)
            if (player.targetCounter === c) {
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3.5;
                ctx.strokeRoundRect(-c.w / 2 - 2, -c.h / 2 - 2, c.w + 4, c.h + 4, 12);
            }

            // 檯身與陰影
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRoundRect(-c.w / 2 + 4, -c.h / 2 + 6, c.w, c.h, 10);

            // 檯面顏色
            let topColor = '#64748b';
            let rimColor = '#94a3b8';

            if (c.type.startsWith('CRATE')) {
                topColor = '#854d0e';
                rimColor = '#a16207';
            } else if (c.type === CounterType.STOVE) {
                topColor = '#1e293b';
                rimColor = '#475569';
            } else if (c.type === CounterType.DELIVERY) {
                topColor = '#065f46';
                rimColor = '#059669';
            } else if (c.type === CounterType.TRASH) {
                topColor = '#374151';
                rimColor = '#4b5563';
            }

            ctx.fillStyle = topColor;
            ctx.fillRoundRect(-c.w / 2, -c.h / 2, c.w, c.h, 10);
            ctx.strokeStyle = rimColor;
            ctx.lineWidth = 2;
            ctx.strokeRoundRect(-c.w / 2, -c.h / 2, c.w, c.h, 10);

            // 特殊檯面飾品繪製
            if (c.type === CounterType.CHOPPING) {
                // 木砧板
                ctx.fillStyle = '#d97706';
                ctx.fillRoundRect(-20, -18, 40, 36, 4);
                // 菜刀
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(12, -14, 5, 28);
            } else if (c.type === CounterType.STOVE) {
                // 電磁爐發熱紅圈
                ctx.strokeStyle = (c.item && c.item.type === ItemType.MEAT) ? '#ef4444' : '#64748b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.stroke();

                // 平底鍋
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fill();
                // 鍋柄
                ctx.fillStyle = '#334155';
                ctx.fillRect(12, -3, 14, 6);
            } else if (c.type === CounterType.DELIVERY) {
                // 傳送帶條紋
                ctx.fillStyle = '#10b981';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('出餐窗口', 0, 24);
            } else if (c.type === CounterType.TRASH) {
                ctx.fillStyle = '#111827';
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fill();
            }

            // 工作檯標籤圖示
            if (c.icon) {
                ctx.font = '20px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(c.icon, 0, c.type === CounterType.DELIVERY ? -4 : 0);
            }

            // 繪製工作檯上的物品
            if (c.item) {
                drawFoodItem(c.item, 0, 0);
            }

            // 切菜或烹調進度條繪製
            if (c.chopProgress > 0) {
                ctx.fillStyle = '#0284c7';
                ctx.fillRect(-22, -c.h / 2 - 8, 44 * c.chopProgress, 5);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(-22, -c.h / 2 - 8, 44, 5);
            }
            if (c.type === CounterType.STOVE && c.item && c.item.state === ItemState.CHOPPED) {
                const cookPct = Math.min(1.0, c.timer / 4.0);
                ctx.fillStyle = '#10b981';
                ctx.fillRect(-22, -c.h / 2 - 8, 44 * cookPct, 5);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(-22, -c.h / 2 - 8, 44, 5);
            } else if (c.type === CounterType.STOVE && c.item && c.item.state === ItemState.COOKED) {
                const burnPct = Math.min(1.0, c.timer / 4.5);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(-22, -c.h / 2 - 8, 44 * burnPct, 5);
                ctx.strokeStyle = '#fca5a5';
                ctx.strokeRect(-22, -c.h / 2 - 8, 44, 5);
            }

            ctx.restore();
        }

        function drawFoodItem(item, x, y) {
            ctx.save();
            ctx.translate(x, y);

            if (item.type === ItemType.MEAT) {
                if (item.state === ItemState.RAW) {
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRoundRect(-13, -10, 26, 20, 5);
                    ctx.fillStyle = '#fca5a5';
                    ctx.fillRect(-7, -4, 14, 4);
                } else if (item.state === ItemState.CHOPPED) {
                    ctx.fillStyle = '#dc2626';
                    ctx.fillRect(-12, -8, 7, 16);
                    ctx.fillRect(-2, -8, 7, 16);
                    ctx.fillRect(8, -8, 7, 16);
                } else if (item.state === ItemState.COOKED) {
                    ctx.fillStyle = '#78350f';
                    ctx.fillRoundRect(-13, -10, 26, 20, 5);
                    // 煎烤焦香紋路
                    ctx.fillStyle = '#451a03';
                    ctx.fillRect(-8, -8, 3, 16);
                    ctx.fillRect(0, -8, 3, 16);
                    ctx.fillRect(8, -8, 3, 16);
                } else if (item.state === ItemState.BURNED) {
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRoundRect(-13, -10, 26, 20, 5);
                }
            } else if (item.type === ItemType.TOMATO) {
                if (item.state === ItemState.RAW) {
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.arc(0, 0, 11, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#15803d';
                    ctx.fillRect(-2, -13, 4, 4);
                } else {
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath(); ctx.arc(-7, 0, 7, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(7, 0, 7, 0, Math.PI * 2); ctx.fill();
                }
            } else if (item.type === ItemType.LETTUCE) {
                if (item.state === ItemState.RAW) {
                    ctx.fillStyle = '#22c55e';
                    ctx.beginPath();
                    ctx.arc(0, 0, 12, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#16a34a';
                    for (let i = -1; i <= 1; i++) {
                        ctx.fillRect(i * 7 - 3, -6, 6, 12);
                    }
                }
            } else if (item.type === ItemType.SALAD) {
                ctx.fillStyle = '#16a34a';
                ctx.beginPath(); ctx.arc(-4, 0, 10, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath(); ctx.arc(5, -2, 6, 0, Math.PI * 2); ctx.fill();
            } else if (item.type === ItemType.MEAT_SALAD) {
                ctx.fillStyle = '#78350f';
                ctx.fillRoundRect(-12, -8, 16, 16, 4);
                ctx.fillStyle = '#22c55e';
                ctx.beginPath(); ctx.arc(7, 0, 8, 0, Math.PI * 2); ctx.fill();
            }

            ctx.restore();
        }

        function drawChef() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // 腳底陰影
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(0, 14, 22, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // 廚師身體 (藍色衣服)
            ctx.fillStyle = '#2563eb';
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1d4ed8';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 白色圍裙
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.arc(0, 4, 15, 0, Math.PI);
            ctx.fill();

            // 廚師高帽 (走動時上下彈跳)
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.arc(0, -6 + player.bounce, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // 廚師面部朝向指示鼻頭
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(player.dirX * 18, player.dirY * 18, 5, 0, Math.PI * 2);
            ctx.fill();

            // 手中拿取的物品
            if (player.heldItem) {
                const holdX = player.dirX * 32;
                const holdY = player.dirY * 32;
                drawFoodItem(player.heldItem, holdX, holdY);
            }

            ctx.restore();
        }

        let lastTime = performance.now();
        let orderTimer = 0;

        function render() {
            const now = performance.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (!isGameOver) {
                // 關卡計時
                gameTime -= delta;
                if (gameTime <= 0) {
                    gameTime = 0;
                    endGame();
                }

                const min = Math.floor(gameTime / 60);
                const sec = Math.floor(gameTime % 60);
                document.getElementById('timer-text').innerText = 
                    `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

                // 定時補充訂單
                orderTimer += delta;
                if (orderTimer > 7.0) {
                    orderTimer = 0;
                    spawnOrder();
                }

                updatePlayer(delta);
                updateCounters(delta);
                updateThrownItems(delta);
                updateOrders(delta);
            }

            // 清空畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // 移動畫布至中心並應用視野縮放
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(viewScale, viewScale);

            drawTileFloor();

            // 繪製工作檯
            counters.forEach(c => drawCounter(c));

            // 繪製拋擲中的生料
            thrownItems.forEach(t => {
                drawFoodItem(t.item, t.x, t.y);
            });

            // 繪製廚師
            drawChef();

            // 繪製粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * delta;
                p.y += p.vy * delta;
                p.life -= delta;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life * p.alpha);
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            // 繪製浮動得分文字
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                const ft = floatTexts[i];
                ft.y -= delta * 32;
                ft.alpha -= delta * 1.1;
                if (ft.alpha <= 0) {
                    floatTexts.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.alpha;
                ctx.font = 'bold 15px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1.0;
            }

            ctx.restore();

            requestAnimationFrame(render);
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('gameover-modal').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-orders').innerText = completedOrders;

            let stars = '⭐';
            if (score >= 420) stars = '⭐⭐⭐';
            else if (score >= 240) stars = '⭐⭐';
            document.getElementById('star-rating').innerText = stars;
        }

        function restartGame() {
            gameTime = 180;
            score = 0;
            completedOrders = 0;
            isGameOver = false;
            activeOrders = [];
            thrownItems = [];
            particles = [];
            floatTexts = [];

            counters.forEach(c => {
                c.item = null;
                c.timer = 0;
                c.chopProgress = 0;
            });
            player.heldItem = null;
            player.x = 0;
            player.y = 30;

            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('score-text').innerText = '0';
            spawnOrder();
            spawnOrder();
        }

        document.getElementById('btn-restart').addEventListener('click', restartGame);

        // Canvas 自適應視窗縮放
        function resize() {
            dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;

            // 根據螢幕尺寸計算適合等比縮放
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            viewScale = (minDim / 560) * dpr;
        }
        window.addEventListener('resize', resize);

        // 確保本機開啟點擊畫布時能立刻取得焦點接收鍵盤事件
        window.addEventListener('click', () => {
            window.focus();
            sfx.init();
        });

        function initGame() {
            window.focus();
            resize();
            buildKitchenLayout();
            spawnOrder();
            spawnOrder();
            requestAnimationFrame(render);
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            initGame();
        } else {
            window.addEventListener('DOMContentLoaded', initGame);
        }
    </script>
</body>
</html>
